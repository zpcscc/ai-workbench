[package]
name = "ai-workbench"
version = "0.1.0"
description = "Local-first AI workbench"
authors = ["AI Workbench"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "=0.3.34"
getrandom = "=0.4.3"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "stream", "system-proxy"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "=1.53.1", features = ["macros", "sync", "time"] }
